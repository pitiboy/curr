<!doctype html>
<html lang="hu">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta
      name="theme-color"
      content="#f4f6f8"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#121417"
      media="(prefers-color-scheme: dark)"
    />
    <title>KÖR – indulás</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f4f6f8;
        --card: #ffffff;
        --text: #1a1f24;
        --muted: #5c6670;
        --accent: #2d6a4f;
        --accent-soft: #d8f3dc;
        --danger: #b42318;
        --track: #e2e8f0;
        --stripe-dark: rgba(0, 0, 0, 0.22);
        --bar: #40b883;
        --card-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
        --focus-ring: #2d6a4f;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          'Helvetica Neue',
          Arial,
          sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121417;
          --card: #1c2026;
          --text: #f3f5f7;
          --muted: #a8b0ba;
          --accent: #52b788;
          --accent-soft: #1b4332;
          --danger: #f97066;
          --track: #2d333b;
          --card-shadow: 0 16px 48px rgba(0, 0, 0, 0.45);
          --focus-ring: #95d5b2;
        }
      }
      * {
        box-sizing: border-box;
      }
      ::selection {
        background: var(--accent-soft);
        color: var(--text);
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        padding: 1.5rem;
      }
      main {
        width: min(28rem, 100%);
        background: var(--card);
        border-radius: 1rem;
        padding: 2rem 1.75rem;
        box-shadow: var(--card-shadow);
      }
      h1 {
        font-size: 1.35rem;
        margin: 0 0 0.35rem;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 1.5rem;
        color: var(--muted);
        line-height: 1.5;
        font-size: 0.95rem;
      }
      .progress {
        --stripe: 1.25rem;
        height: 1.5rem;
        background: var(--track);
        border-radius: 0.25rem;
        overflow: hidden;
        margin: 1rem 0 0.75rem;
      }
      /* Continuously moving 45° hatching: signals activity even when the
         width barely changes, so the bar never looks frozen. */
      .progress > span {
        display: block;
        height: 100%;
        width: 0;
        background-color: var(--bar);
        background-image: linear-gradient(
          -45deg,
          var(--stripe-dark) 25%,
          transparent 25%,
          transparent 50%,
          var(--stripe-dark) 50%,
          var(--stripe-dark) 75%,
          transparent 75%,
          transparent
        );
        background-size: var(--stripe) var(--stripe);
        animation: progress-stripes 0.8s linear infinite;
        transition: width 0.3s linear;
      }
      .progress.failed > span {
        animation-play-state: paused;
        background-color: var(--muted);
      }
      @keyframes progress-stripes {
        from {
          background-position: 0 0;
        }
        to {
          background-position: var(--stripe) 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .progress > span {
          animation: none;
        }
      }
      .status {
        font-size: 0.95rem;
        min-height: 2.5em;
      }
      .error {
        color: var(--danger);
      }
      button {
        margin-top: 1rem;
        border: 0;
        border-radius: 0.5rem;
        padding: 0.7rem 1rem;
        min-height: 2.75rem;
        width: 100%;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        background: var(--accent);
        color: #fff;
        display: none;
        transition: background-color 0.15s ease-out;
      }
      button:hover {
        background: color-mix(in srgb, var(--accent) 88%, #000);
      }
      button:active {
        background: color-mix(in srgb, var(--accent) 78%, #000);
      }
      button:focus-visible {
        outline: 2px solid var(--focus-ring);
        outline-offset: 2px;
      }
      @media (prefers-reduced-motion: reduce) {
        button {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main id="app" aria-busy="true">
      <h1>KÖR</h1>
      <p>Közösségi Önjegyző Rendszer</p>
      <div
        class="progress"
        id="progress"
        role="progressbar"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
        aria-labelledby="status"
      >
        <span id="bar"></span>
      </div>
      <div class="status" id="status" role="status" aria-live="polite">
        A szerver ébresztése folyamatban…
      </div>
      <button type="button" id="retry">Újrapróbálás</button>
    </main>
    <script>
      (function () {
        const STATUS_WAKING = 'A szerver ébresztése folyamatban…';
        const STATUS_ALMOST = 'Mindjárt kész…';
        const STATUS_REDIRECT = 'Átirányítás…';
        const STATUS_FAIL = 'Nem sikerült elérni a szervert. Próbáld újra!';
        const DEFAULT_TARGET = '/backoffice/';
        const WAKE_URL = '/api/wake';
        const READY_URL = '/api/wake/ready';
        const TIMEOUT_MS = 120000;

        const params = new URLSearchParams(window.location.search);
        const bar = document.getElementById('bar');
        const progressEl = document.getElementById('progress');
        const statusEl = document.getElementById('status');
        const retryBtn = document.getElementById('retry');
        const appEl = document.getElementById('app');

        function normalizeRedirectTarget(raw, fallback) {
          const trimmed = (raw || '').trim();
          return trimmed || fallback;
        }

        function isSafeSameOriginRedirectPath(path) {
          if (!path.startsWith('/') || path.startsWith('//')) return false;
          if (path.includes('://') || path.includes('\\')) return false;
          try {
            const resolved = new URL(path, window.location.origin);
            return resolved.origin === window.location.origin;
          } catch {
            return false;
          }
        }

        function resolveRedirectTarget(raw, fallback) {
          const normalized = normalizeRedirectTarget(raw, fallback);
          return isSafeSameOriginRedirectPath(normalized) ? normalized : null;
        }

        const redirectTarget =
          resolveRedirectTarget(params.get('next'), DEFAULT_TARGET) ||
          DEFAULT_TARGET;

        let attempt = 0;
        let aborted = false;
        let controller = null;

        // Progress creeps asymptotically toward the current phase's ceiling,
        // so it keeps moving (ever slower) without ever claiming "done" early.
        // tau = time constant in ms: ~63% of the remaining gap is covered per tau.
        const PHASES = {
          wake: { ceiling: 0.35, tau: 12000 },
          ready: { ceiling: 0.92, tau: 30000 },
        };
        const TICK_MS = 250;
        let progress = 0;
        let phase = PHASES.wake;
        let ticker = null;

        function renderProgress() {
          const pct = progress * 100;
          bar.style.width = pct.toFixed(2) + '%';
          progressEl.setAttribute('aria-valuenow', String(Math.round(pct)));
        }

        function startProgress() {
          progress = 0.02;
          phase = PHASES.wake;
          progressEl.classList.remove('failed');
          renderProgress();
          stopProgress();
          ticker = setInterval(() => {
            const gap = phase.ceiling - progress;
            if (gap > 0) {
              progress += gap * (1 - Math.exp(-TICK_MS / phase.tau));
              renderProgress();
            }
          }, TICK_MS);
        }

        function stopProgress() {
          if (ticker) clearInterval(ticker);
          ticker = null;
        }

        function setPhase(next) {
          phase = next;
        }

        function finishProgress() {
          stopProgress();
          progress = 1;
          renderProgress();
        }

        function failProgress() {
          stopProgress();
          progressEl.classList.add('failed');
        }

        function setStatus(text, isError) {
          statusEl.textContent = text;
          statusEl.classList.toggle('error', Boolean(isError));
        }

        function sleep(ms) {
          return new Promise((resolve) => setTimeout(resolve, ms));
        }

        function backoffMs(n) {
          return Math.min(8000, 400 + n * 450);
        }

        async function ping(url, method) {
          const res = await fetch(url, {
            method: method || 'GET',
            cache: 'no-store',
            credentials: 'same-origin',
            signal: controller ? controller.signal : undefined,
          });
          return res;
        }

        async function waitUntilReady(startedAt) {
          while (!aborted) {
            attempt += 1;
            const elapsed = Date.now() - startedAt;
            if (elapsed > 6000) {
              setStatus(STATUS_ALMOST, false);
            }
            if (elapsed > TIMEOUT_MS) {
              throw new Error('timeout');
            }

            try {
              const readyRes = await ping(READY_URL);
              if (readyRes.ok) {
                const targetRes = await ping(redirectTarget, 'HEAD');
                if (
                  targetRes.ok ||
                  (targetRes.status >= 300 && targetRes.status < 400)
                ) {
                  return;
                }
              }
            } catch {
              /* keep polling */
            }

            await sleep(backoffMs(attempt));
          }
        }

        function setBusy(busy) {
          appEl.setAttribute('aria-busy', busy ? 'true' : 'false');
        }

        async function run() {
          aborted = false;
          attempt = 0;
          retryBtn.style.display = 'none';
          setBusy(true);
          setStatus(STATUS_WAKING, false);
          startProgress();
          controller = new AbortController();
          const startedAt = Date.now();

          try {
            await ping(WAKE_URL);
            setPhase(PHASES.ready);
            await waitUntilReady(startedAt);
            finishProgress();
            setStatus(STATUS_REDIRECT, false);
            setBusy(false);
            // Let the bar visibly reach 100% before navigating away.
            await sleep(350);
            window.location.replace(redirectTarget);
          } catch {
            failProgress();
            setStatus(STATUS_FAIL, true);
            setBusy(false);
            retryBtn.style.display = 'block';
          }
        }

        retryBtn.addEventListener('click', () => {
          if (controller) {
            controller.abort();
          }
          run();
        });

        run();
      })();
    </script>
  </body>
</html>
