# Sikeres checkout után skip-worktree vissza (git-mm / git-safe / nyers checkout).
# Nincs natív pre-checkout: a „would be overwritten” előtt a Git nem futtat hookot.
# STRAPI_SKIP_POST_CHECKOUT_HOOK=1: prep alatti restore ne kapcsolja vissza a skipet.
post-checkout:
  commands:
    strapi-generated-skip-on:
      run: |
        if [ "${STRAPI_SKIP_POST_CHECKOUT_HOOK:-}" = "1" ]; then
          exit 0
        fi
        bash scripts/reset-strapi-generated-git.sh skip-on

pre-commit:
  parallel: true
  commands:
    prettier:
      glob: '*.{js,ts,tsx,json,md,yml,yaml,css,html}'
      exclude:
        - 'package-lock.json'
        - '.claude/agents/*.md' # symlinks to .cursor/agents; prettier rejects explicit symlinks
        - 'types/generated/**'
        - 'src/extensions/documentation/documentation/**/full_documentation.json'
        - 'src/extensions/documentation/public/index.html'
      run: npx prettier --write {staged_files}
    backoffice-lint:
      glob: 'apps/content-backoffice/**/*.{ts,tsx}'
      root: true
      run: npx --prefix apps/content-backoffice oxlint {staged_files}
    typecheck:
      run: npm run typecheck
    strapi-tests:
      glob: 'src/**/*.{ts,js}'
      run: npm test
    backoffice-tests:
      glob: 'apps/content-backoffice/**/*.{ts,tsx}'
      run: cd apps/content-backoffice && npm test
