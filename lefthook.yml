pre-commit:
  parallel: true
  commands:
    prettier:
      glob: '*.{js,ts,tsx,json,md,yml,yaml,css,html}'
      exclude: 'package-lock.json'
      run: npx prettier --write {staged_files}
    backoffice-lint:
      glob: 'apps/content-backoffice/**/*.{ts,tsx}'
      run: cd apps/content-backoffice && npx oxlint {staged_files}
    typecheck:
      run: npm run typecheck
    strapi-tests:
      glob: 'src/**/*.{ts,js}'
      run: npm test
    backoffice-tests:
      glob: 'apps/content-backoffice/**/*.{ts,tsx}'
      run: cd apps/content-backoffice && npm test
