name: Deploy cPanel (kor.fejlesztesek.hu)

on:
  # push:
  # branches:
  # - main
  workflow_dispatch:
    inputs:
      target:
        description: Mit telepítsünk
        type: choice
        options:
          - auto
          - backend
          - backoffice
          - both
        default: auto
      dry_run:
        description: Csak szimuláció (FTP dry-run, nincs éles restart)
        type: boolean
        default: false

concurrency:
  group: deploy-cpanel-kor
  cancel-in-progress: false

permissions:
  contents: read

env:
  DEPLOY_BASE_URL: https://kor.fejlesztesek.hu

jobs:
  changes:
    name: Detect deploy targets
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.resolve.outputs.backend }}
      backoffice: ${{ steps.resolve.outputs.backoffice }}
      skip: ${{ steps.resolve.outputs.skip }}
      lockfile: ${{ steps.filter.outputs.lockfile }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'config/**'
              - 'src/**'
              - 'public/**'
              - '!public/backoffice/**'
              - 'package.json'
              - 'package-lock.json'
              - 'server.js'
              - 'favicon.*'
              - 'types/**'
              - 'database/**'
              - 'scripts/deploy/**'
              - 'scripts/ftp-deploy*.sh'
            backoffice:
              - 'apps/content-backoffice/**'
            lockfile:
              - 'package-lock.json'
      - name: Resolve targets
        id: resolve
        run: |
          backend="${{ steps.filter.outputs.backend }}"
          backoffice="${{ steps.filter.outputs.backoffice }}"
          input="${{ github.event.inputs.target || 'auto' }}"
          if [[ "$input" == "backend" ]]; then backoffice=false; backend=true; fi
          if [[ "$input" == "backoffice" ]]; then backoffice=true; backend=false; fi
          if [[ "$input" == "both" ]]; then backoffice=true; backend=true; fi
          if [[ "$backend" != "true" && "$backoffice" != "true" ]]; then
            echo "Nincs deployolható változás; kilépés."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "backoffice=$backoffice" >> "$GITHUB_OUTPUT"

  deploy:
    name: Build, upload, post-deploy
    needs: changes
    if: needs.changes.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps (lftp)
        run: sudo apt-get update && sudo apt-get install -y lftp

      - run: npm ci

      - name: Build Strapi backend
        if: needs.changes.outputs.backend == 'true'
        run: npm run build
        env:
          NODE_ENV: production
          APP_KEYS: test-key-1,test-key-2,test-key-3,test-key-4
          API_TOKEN_SALT: ci-api-token-salt
          ADMIN_JWT_SECRET: ci-admin-jwt-secret
          TRANSFER_TOKEN_SALT: ci-transfer-token-salt
          JWT_SECRET: ci-jwt-secret
          ENCRYPTION_KEY: ci-encryption-key
          DATABASE_CLIENT: sqlite

      - name: Install backoffice deps
        if: needs.changes.outputs.backoffice == 'true'
        run: npm ci --prefix apps/content-backoffice

      - name: Build backoffice
        if: needs.changes.outputs.backoffice == 'true'
        run: npm run build:f:kor.fejlesztesek.hu

      - name: FTP upload
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_OVERRIDE_POLICY: ${{ vars.FTP_OVERRIDE_POLICY || 'only-newer' }}
          FTP_BACKOFFICE_REMOTE_DIR: ${{ vars.FTP_BACKOFFICE_REMOTE_DIR || 'public/backoffice' }}
          CPANEL_APP_ROOT: ${{ secrets.CPANEL_APP_ROOT }}
        run: |
          set -euo pipefail
          dry=""
          [[ "${{ github.event.inputs.dry_run }}" == "true" ]] && dry="--dry-run"
          if [[ "${{ needs.changes.outputs.backend }}" == "true" && "${{ needs.changes.outputs.backoffice }}" == "true" ]]; then
            bash scripts/deploy/upload.sh both $dry
          elif [[ "${{ needs.changes.outputs.backend }}" == "true" ]]; then
            bash scripts/deploy/upload.sh backend $dry
          else
            bash scripts/deploy/upload.sh backoffice $dry
          fi

      - name: cPanel UAPI probe (restart / npm)
        if: needs.changes.outputs.backend == 'true' && github.event.inputs.dry_run != 'true'
        id: cpanel
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          CPANEL_APP_ROOT: ${{ secrets.CPANEL_APP_ROOT }}
          CPANEL_WEBAPP_NAME: ${{ vars.CPANEL_WEBAPP_NAME }}
          CPANEL_PASSENGER_APP_NAME: ${{ vars.CPANEL_PASSENGER_APP_NAME }}
          RUN_NPM_INSTALL: ${{ needs.changes.outputs.lockfile == 'true' && '1' || '0' }}
        run: |
          bash scripts/deploy/cpanel-api.sh | tee cpanel-api.log
          if grep -q 'WebApp restart sikeres' cpanel-api.log; then
            echo "restart=uapi" >> "$GITHUB_OUTPUT"
          else
            echo "restart=ftp" >> "$GITHUB_OUTPUT"
          fi
          if [[ "${{ needs.changes.outputs.lockfile }}" == "true" ]] && ! grep -q 'ensure_deps elindítva' cpanel-api.log; then
            echo "npm_manual=true" >> "$GITHUB_OUTPUT"
          else
            echo "npm_manual=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Passenger restart.txt fallback
        if: needs.changes.outputs.backend == 'true' && steps.cpanel.outputs.restart == 'ftp' && github.event.inputs.dry_run != 'true'
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
          CPANEL_APP_ROOT: ${{ secrets.CPANEL_APP_ROOT }}
        run: bash scripts/deploy/upload.sh restart-txt

      - name: Health check
        id: health
        if: github.event.inputs.dry_run != 'true'
        env:
          CHECK_BACKEND: ${{ needs.changes.outputs.backend == 'true' && '1' || '0' }}
          CHECK_BACKOFFICE: ${{ needs.changes.outputs.backoffice == 'true' && '1' || '0' }}
        run: bash scripts/deploy/health-check.sh
        continue-on-error: true

      - name: Manual step summary (NPM Install)
        if: steps.cpanel.outputs.npm_manual == 'true'
        run: |
          {
            echo "## Manuális lépés: NPM Install (cPanel)"
            echo ""
            echo "A \`package-lock.json\` változott, és a cPanel UAPI nem indította el az \`ensure_deps\` telepítést."
            echo ""
            echo "1. Jelentkezz be a cPanelbe."
            echo "2. **Software → Setup Node.js App**."
            echo "3. Válaszd a \`kor.fejlesztesek.hu\` alkalmazást (gyökér: \`node/kor-szupatak\`)."
            echo "4. **Run NPM Install** (alias alkalmazáson ne)."
            echo "5. Telepítés előtt töröld a \`nodevenv/node/kor-szupatak/22/lib/node_modules\` tartalmát a Fájlkezelőben (lásd docs/deploy/cpanel/npm-install.md)."
            echo "6. **Restart** mindkét Node.js alkalmazáson (kor + edizone alias), ha van."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify manual / failure
        if: (steps.cpanel.outputs.npm_manual == 'true' || steps.health.outcome == 'failure') && github.event.inputs.dry_run != 'true'
        id: notify
        env:
          NOTIFY_ACTION: manual
          NOTIFY_TITLE: 'Deploy kor.fejlesztesek.hu – manuális lépés'
          NOTIFY_BODY: |
            Deploy run needs operator action (NPM Install and/or health check failed).
            See workflow job summary for cPanel click steps.
          TRELLO_KEY: ${{ secrets.TRELLO_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          TRELLO_LIST_ID: ${{ secrets.TRELLO_LIST_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
        run: python3 scripts/deploy/notify.py

      - name: Wait for operator approval
        if: (steps.cpanel.outputs.npm_manual == 'true' || steps.health.outcome == 'failure') && github.event.inputs.dry_run != 'true'
        environment: manual-cpanel
        run: echo "manual-cpanel environment approved; continuing deploy."

      - name: Re-run health check after approval
        if: (steps.cpanel.outputs.npm_manual == 'true' || steps.health.outcome == 'failure') && github.event.inputs.dry_run != 'true'
        env:
          CHECK_BACKEND: ${{ needs.changes.outputs.backend == 'true' && '1' || '0' }}
          CHECK_BACKOFFICE: ${{ needs.changes.outputs.backoffice == 'true' && '1' || '0' }}
        run: bash scripts/deploy/health-check.sh

      - name: Deploy success notification
        if: success() && github.event.inputs.dry_run != 'true'
        env:
          NOTIFY_ACTION: success
          TRELLO_KEY: ${{ secrets.TRELLO_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          TRELLO_CARD_ID: ${{ steps.notify.outputs.trello_card_id }}
          TRELLO_DONE_LIST_ID: ${{ secrets.TRELLO_DONE_LIST_ID }}
        run: python3 scripts/deploy/notify.py || true

      - name: Deploy failure notification
        if: failure() && github.event.inputs.dry_run != 'true'
        env:
          NOTIFY_ACTION: failure
          NOTIFY_TITLE: 'Deploy kor.fejlesztesek.hu – FAILED'
          NOTIFY_BODY: 'A deploy workflow hibára futott. Nézd meg a GitHub Actions logot.'
          TRELLO_KEY: ${{ secrets.TRELLO_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          TRELLO_LIST_ID: ${{ secrets.TRELLO_LIST_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
        run: python3 scripts/deploy/notify.py || true
